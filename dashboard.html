<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestor Personal - Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="dashboard-body">

    <header class="navbar">
        <div class="logo">Gestor de Tareas</div>
        <nav class="nav-links">
            <a href="dashboard.html" class="active">Personal</a>
            <a href="grupos.html">Grupos</a>
        </nav>
        
        <div class="profile-menu">
            <div class="profile-trigger" id="profile-trigger" style="display: flex; align-items: center; gap: 10px; cursor: pointer;">
                <div style="width: 35px; height: 35px; position: relative;">
                    <div id="avatar-placeholder" style="width: 100%; height: 100%; background-color: #007bff; color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; text-transform: uppercase;">
                        ?
                    </div>
                    <img id="user-avatar" src="" alt="Avatar" class="avatar hidden" style="width: 100%; height: 100%; border-radius: 50%; object-fit: cover; position: absolute; top: 0; left: 0;">
                </div>
                <span id="user-name">Cargando...</span>
            </div>
            <div class="dropdown-content hidden" id="profile-dropdown">
                <a href="perfil.html">⚙️ Mi Perfil</a>
                <a href="#" id="logout-btn" class="text-danger">🚪 Cerrar Sesión</a>
            </div>
        </div>
    </header>

    <!-- NUEVO LAYOUT DE 3 COLUMNAS IDÉNTICO A GRUPOS -->
    <main class="dashboard-grid-layout">
        
        <!-- COLUMNA 1: Calendario Lateral -->
        <aside id="sidebar-calendar-area">
            <div id="calendar-wrapper-card" class="calendar-card">
                <div class="calendar-header">
                    <button id="prev-month-btn" class="calendar-nav-btn" title="Mes anterior">‹</button>
                    
                    <div style="display: flex; align-items: center; gap: 4px;">
                        <span id="calendar-month-name" style="font-size: 1.1em; font-weight: bold; color: #333;">Cargando...</span>
                        <input type="number" id="calendar-year-input" min="2000" max="2100" title="Haz clic para escribir o cambiar el año">
                    </div>

                    <button id="next-month-btn" class="calendar-nav-btn" title="Mes siguiente">›</button>
                </div>
                <div class="calendar-weekdays">
                    <span>L</span><span>M</span><span>X</span><span>J</span><span>V</span><span>S</span><span>D</span>
                </div>
                <div id="calendar-grid" class="calendar-grid">
                    <!-- Los días se renderizan dinámicamente con JS -->
                </div>
            </div>
        </aside>

        <!-- COLUMNA 2: Contenido Principal (Formulario y Lista de Tareas) -->
        <section id="main-content-area">
            
            <div class="task-list-section" style="margin-top: 0;">
                
                <div class="task-form-card" style="margin-bottom: 25px; box-shadow: 0 2px 5px rgba(0,0,0,0.05);">
                    <h3 style="margin-top: 0; margin-bottom: 15px; color: #333;">Nueva Tarea Personal</h3>
                    <form id="create-task-form">
                        <div class="form-group">
                            <input type="text" id="task-title" required placeholder="Nombre de la tarea...">
                        </div>
                        <div class="form-group">
                            <textarea id="task-desc" placeholder="Descripción (opcional)" rows="2" style="width: 100%; box-sizing: border-box; padding: 8px; border: 1px solid #ddd; border-radius: 4px; font-family: inherit; resize: vertical;"></textarea>
                        </div>
                        
                        <div class="form-group" style="display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap;">
                            <div style="display: flex; align-items: center; gap: 10px;">
                                <label for="task-file" class="btn-secondary" style="cursor: pointer; padding: 8px 12px; font-size: 13px;">
                                    📎 Adjuntar archivo (opcional)
                                    <input type="file" id="task-file" class="hidden-file-input" style="display: none;">
                                </label>
                                <span id="file-name-display" class="file-name" style="font-size: 13px; color: #666;">Ningún archivo...</span>
                            </div>
                            
                            <div style="display: flex; align-items: center; gap: 10px;">
                                <label style="font-size: 13px; font-weight: bold; color: #555;">🎨 Color:</label>
                                <div class="color-dropdown-wrapper">
                                    <button type="button" id="task-color-trigger" class="btn-secondary" style="display: flex; align-items: center; gap: 8px; height: 35px; box-sizing: border-box; cursor: pointer;">
                                        <span id="task-color-preview-swatch" style="width: 16px; height: 16px; border-radius: 3px; background-color: #ffffff; border: 1px solid #ccc; display: inline-block;"></span>
                                        <span id="task-color-preview-text">Blanco</span> ▾
                                    </button>
                                    <div id="task-color-dropdown" class="color-dropdown-content hidden"></div>
                                    <input type="hidden" id="task-color-value" value="blanco">
                                </div>
                            </div>

                            <div>
                                <label class="btn-secondary" style="cursor: pointer; padding: 8px 12px; font-size: 13px; display: inline-flex; align-items: center; gap: 6px;">
                                    📅 
                                    <input type="date" id="task-date" style="background: transparent; border: none; font-family: inherit; font-size: 13px; color: #333; cursor: pointer; outline: none;">
                                </label>
                            </div>
                        </div>
                        
                        <button type="submit" class="btn-primary" style="margin-top: 10px;">Añadir Tarea</button>
                    </form>
                </div>

                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; gap: 15px; flex-wrap: wrap;">
                    <h3 style="margin: 0; font-size: 1.3em;">Mis Tareas</h3>
                    
                    <div style="display: flex; align-items: center; gap: 10px; flex-wrap: wrap;">
                        <input type="text" id="search-task" class="btn-secondary" placeholder="🔍 Buscar tarea..." style="padding: 6px 12px; border: none; font-size: 13px; outline: none; font-family: inherit; height: 35px; box-sizing: border-box; width: 140px; color: #333;">
                        
                        <select id="filter-file" class="btn-secondary" style="padding: 6px 10px; border: none; font-size: 13px; outline: none; cursor: pointer; font-family: inherit; height: 35px; box-sizing: border-box; color: #333;">
                            <option value="all" style="background: #fff; color: #333;">📎 Archivos (Todos)</option>
                            <option value="with" style="background: #fff; color: #333;">Con archivo</option>
                            <option value="without" style="background: #fff; color: #333;">Sin archivo</option>
                        </select>

                        <div class="color-dropdown-wrapper">
                            <button type="button" id="filter-color-trigger" class="btn-secondary" style="display: flex; align-items: center; gap: 8px; height: 35px; box-sizing: border-box; cursor: pointer;">
                                <span id="filter-color-preview-text">🎨 Colores (Todos)</span> ▾
                            </button>
                            <div id="filter-color-dropdown" class="color-dropdown-content hidden" style="width: 150px;"></div>
                            <input type="hidden" id="filter-color-value" value="all">
                        </div>

                        <label class="btn-secondary" style="cursor: pointer; padding: 6px 10px; font-size: 13px; display: inline-flex; align-items: center; gap: 6px; height: 35px; box-sizing: border-box; margin: 0; border-radius: 4px;" title="Filtrar por fecha concreta">
                            📅 
                            <input type="date" id="filter-date" style="background: transparent; border: none; font-family: inherit; font-size: 13px; color: #333; cursor: pointer; outline: none;">
                        </label>

                        <button id="clear-filters-btn" class="btn-secondary" style="padding: 6px 14px; font-size: 13px; border: none; cursor: pointer; height: 35px; box-sizing: border-box; display: inline-flex; align-items: center; gap: 6px; border-radius: 4px;" title="Limpiar filtros">
                            ❌ Limpiar
                        </button>
                    </div>
                </div>
                
                <div id="task-list" class="task-list">
                    <p class="empty-state">Cargando tus tareas...</p>
                </div>

            </div>

        </section>

        <!-- COLUMNA 3: Margen de apoyo lateral derecho simétrico a grupos -->
        <aside id="right-margin-area">
            <section class="task-form-card" style="height: fit-content; position: sticky; top: 90px; background: transparent; box-shadow: none; border: none; padding: 0;">
                <!-- Espacio reservado o panel lateral de resumen personal opcional -->
            </section>
        </aside>

    </main>

    <div id="delete-modal" class="modal-overlay hidden">
        <div class="modal-card">
            <h3>Eliminar Tarea</h3>
            <p>¿Estás seguro de que deseas borrar esta tarea? Esta acción no se puede deshacer.</p>
            <div class="modal-actions">
                <button id="cancel-delete-btn" class="btn-secondary">Cancelar</button>
                <button id="confirm-delete-btn" class="btn-danger">Sí, eliminar</button>
            </div>
        </div>
    </div>
    
    <div id="toast-notification" class="toast"></div>

    <script type="module" src="js/dashboard.js"></script>
</body>
</html>
