<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestor Personal - Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="dashboard-body">

    <header class="navbar">
        <div class="logo">Gestor de Tareas</div>
        <nav class="nav-links">
            <a href="dashboard.html" class="active">Personal</a>
            <a href="grupos.html">Grupos</a>
        </nav>
        
        <div class="profile-menu">
            <div class="profile-trigger" id="profile-trigger" style="display: flex; align-items: center; gap: 10px; cursor: pointer;">
                <div style="width: 35px; height: 35px; position: relative;">
                    <div id="avatar-placeholder" style="width: 100%; height: 100%; background-color: #007bff; color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; text-transform: uppercase;">
                        ?
                    </div>
                    <img id="user-avatar" src="" alt="Avatar" class="avatar hidden" style="width: 100%; height: 100%; border-radius: 50%; object-fit: cover; position: absolute; top: 0; left: 0;">
                </div>
                <span id="user-name">Cargando...</span>
            </div>
            <div class="dropdown-content hidden" id="profile-dropdown">
                <a href="perfil.html">⚙️ Mi Perfil</a>
                <a href="#" id="logout-btn" class="text-danger">🚪 Cerrar Sesión</a>
            </div>
        </div>
    </header>

    <main class="dashboard-container">
        
        <section class="task-form-card">
            <h3>Nueva Tarea Personal</h3>
            <form id="create-task-form">
                <div class="form-group">
                    <input type="text" id="task-title" required placeholder="Nombre de la tarea...">
                </div>
                <div class="form-group">
                    <textarea id="task-desc" placeholder="Descripción (opcional)" rows="2"></textarea>
                </div>
                
                <div class="form-group" style="display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap;">
                    <div style="display: flex; align-items: center; gap: 10px;">
                        <label for="task-file" class="btn-secondary" style="cursor: pointer;">📎 Adjuntar archivo (opcional)</label>
                        <input type="file" id="task-file" class="hidden-file-input">
                        <span id="file-name-display" class="file-name">Ningún archivo...</span>
                    </div>
                    <div>
                        <label for="task-date" class="btn-secondary" style="cursor: pointer; display: inline-flex; align-items: center; gap: 6px;">
                            📅 
                            <input type="date" id="task-date" style="background: transparent; border: none; font-family: inherit; font-size: 14px; color: #333; cursor: pointer; outline: none;">
                        </label>
                    </div>
                </div>
                
                <button type="submit" class="btn-primary">Añadir Tarea</button>
            </form>
        </section>

        <section class="task-list-section">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; gap: 15px; flex-wrap: wrap;">
                <h3 style="margin: 0; font-size: 1.3em;">Mis Tareas</h3>
                
                <div style="display: flex; align-items: center; gap: 10px; flex-wrap: wrap;">
                    
                    <!-- 1. Buscador con estilo gris (.btn-secondary) -->
                    <input type="text" id="search-task" class="btn-secondary" placeholder="🔍 Buscar tarea..." style="padding: 6px 12px; border: none; font-size: 13px; outline: none; font-family: inherit; height: 35px; box-sizing: border-box; width: 160px; color: #333;">
                    
                    <!-- 2. Filtro de Archivo con estilo gris (.btn-secondary) -->
                    <select id="filter-file" class="btn-secondary" style="padding: 6px 10px; border: none; font-size: 13px; outline: none; cursor: pointer; font-family: inherit; height: 35px; box-sizing: border-box; color: #333;">
                        <option value="all" style="background: #fff; color: #333;">📎 Archivos (Todos)</option>
                        <option value="with" style="background: #fff; color: #333;">Con archivo</option>
                        <option value="without" style="background: #fff; color: #333;">Sin archivo</option>
                    </select>

                    <!-- 3. Selector de Fecha Concreta -->
                    <label class="btn-secondary" style="cursor: pointer; padding: 6px 10px; font-size: 13px; display: inline-flex; align-items: center; gap: 6px; height: 35px; box-sizing: border-box; margin: 0; border-radius: 4px;" title="Filtrar por fecha concreta">
                        📅 
                        <input type="date" id="filter-date" style="background: transparent; border: none; font-family: inherit; font-size: 13px; color: #333; cursor: pointer; outline: none;">
                    </label>

                    <!-- 4. Botón Limpiar -->
                    <button id="clear-filters-btn" class="btn-secondary" style="padding: 6px 14px; font-size: 13px; border: none; cursor: pointer; height: 35px; box-sizing: border-box; display: inline-flex; align-items: center; gap: 6px; border-radius: 4px;" title="Limpiar filtros">
                        ❌ Limpiar
                    </button>

                </div>
            </div>
            
            <div id="task-list" class="task-list">
                <p class="empty-state">Cargando tus tareas...</p>
            </div>
        </section>
    </main>

    <div id="delete-modal" class="modal-overlay hidden">
        <div class="modal-card">
            <h3>Eliminar Tarea</h3>
            <p>¿Estás seguro de que deseas borrar esta tarea? Esta acción no se puede deshacer.</p>
            <div class="modal-actions">
                <button id="cancel-delete-btn" class="btn-secondary">Cancelar</button>
                <button id="confirm-delete-btn" class="btn-danger">Sí, eliminar</button>
            </div>
        </div>
    </div>
    
    <div id="toast-notification" class="toast"></div>

    <script type="module" src="js/dashboard.js"></script>
</body>
</html>
