<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestor de Tareas - Recuperar Contraseña</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="auth-wrapper">
        <section class="auth-card">
            <h2>Recuperar Contraseña</h2>
            <p style="font-size: 14px; color: #666; margin-bottom: 20px; line-height: 1.4;">
                Introduce tu correo electrónico registrado y te enviaremos un enlace seguro para restablecer tu contraseña.
            </p>
            <form id="recovery-form">
                <div class="form-group">
                    <label for="recovery-email">Correo Electrónico</label>
                    <input type="email" id="recovery-email" required placeholder="tu@email.com">
                </div>
                <button type="submit" id="recovery-btn" class="btn-primary">Enviar Enlace</button>
            </form>
            <p class="toggle-text">
                <a href="index.html">Volver al inicio de sesión</a>
            </p>
        </section>
    </div>

    <div id="toast-notification" class="toast"></div>

    <script type="module" src="js/recuperar.js"></script>
</body>
</html>
