<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestor de Tareas - Actualizar Contraseña</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="auth-wrapper">
        <section class="auth-card">
            <h2>Actualizar Contraseña</h2>
            <p style="font-size: 14px; color: #666; margin-bottom: 20px; line-height: 1.4;">
                Introduce tu nueva contraseña para restablecer el acceso a tu cuenta.
            </p>
            <form id="update-password-form">
                <div class="form-group">
                    <label for="new-password">Nueva Contraseña</label>
                    <input type="password" id="new-password" required minlength="6" placeholder="Mínimo 6 caracteres">
                </div>
                <div class="form-group">
                    <label for="confirm-new-password">Confirmar Contraseña</label>
                    <input type="password" id="confirm-new-password" required placeholder="Repite la contraseña">
                </div>
                <button type="submit" id="update-btn" class="btn-primary">Actualizar Contraseña</button>
            </form>
        </section>
    </div>

    <!-- Notificación Toast idéntica al resto de la aplicación -->
    <div id="toast-notification" class="toast"></div>

    <script type="module" src="js/actualizar-password.js"></script>
</body>
</html>
